[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uc3m"
version = "1.0.0"
description = "UC3M — Universal CityLearn v3 Modified: Meta-Dec-POMDP MADRL framework for smart energy communities"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "MADRL Iquitos Team", email = "mac.tapia@unmsm.edu.pe" },
]
requires-python = ">=3.9"
keywords = ["MARL", "MADRL", "CityLearn", "smart-grid", "energy", "reinforcement-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies
dependencies = [
    "numpy>=1.23.5,<2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    # CityLearn (submodule fork) and the native backends are local dependencies,
    # see [tool.uc3m.local-dependencies]; they are not installed from PyPI.
]

[project.optional-dependencies]
# Full training stack — install with: pip install uc3m[train]
train = [
    "torch>=2.0",
    "gym==0.20.0",
    # uc3m/env/wrappers.py; same versions as requirements.txt, CityLearn needs gymnasium<=0.28.1.
    "gymnasium==0.28.1",
    "pettingzoo==1.12.0",
    "pvlib>=0.10",
    "stable-baselines3==2.2.1",
]
# Dataset generation — pip install uc3m[dataset]
dataset = [
    "pvlib>=0.10",
    "pypdf>=6.10,<7",
    "requests>=2.28",
    "tqdm>=4.65",
]
# All extras
all = [
    "torch>=2.0",
    "gymnasium==0.28.1",
    "pettingzoo==1.12.0",
    "pvlib>=0.10",
    "pypdf>=6.10,<7",
    "requests>=2.28",
    "tqdm>=4.65",
    "stable-baselines3==2.2.1",
]
# Figures of the multicriteria analysis
analysis = [
    "matplotlib>=3.9",
]
# Development / testing
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/Mac-Tapia/MADRLCitytleranflexresdr"
Repository = "https://github.com/Mac-Tapia/MADRLCitytleranflexresdr"

# uv cannot build gym==0.20.0 (invalid metadata) and pettingzoo pulls gym in, so a lock would pin a
# version the project does not run. gym stays out of uv.lock (the marker never holds); requirements.txt
# and the Colab notebook pin it, as they do for other packages outside the lock.
[tool.uv]
override-dependencies = ["gym==0.20.0; python_version < '3'"]

# Import name -> local checkout or vendored package, never a PyPI homonym.
[tool.uc3m.local-dependencies]
citylearn = "CityLearn"
harl = "external/HARL"
marllib = "external/MARLlib"
algorithms = "external/MAAC"
offpolicy = "external/off-policy"

# Generic names exist only inside the native adapter's scoped import context.
[tool.uc3m.backend-namespaces]
common = { root = "external/MARL/src", consumers = ["uc3m/adapters/citylearn/policy_inference.py"] }
agent = { root = "external/MARL/src", consumers = ["uc3m/adapters/citylearn/policy_inference.py"] }
ac_discrete = { root = "external/MARL/src", consumers = ["uc3m/adapters/citylearn/policy_inference.py"] }
utils = { root = "external/MAAC", consumers = ["uc3m/adapters/citylearn/policy_inference.py"] }

[tool.setuptools]
packages = { find = { where = ["."], include = ["uc3m*"] } }

[tool.setuptools.package-data]
"uc3m" = ["py.typed"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["uc3m"]
omit = ["tests/*", "tools/*", "external/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
extend-exclude = [
    ".venv39-citylearn-v3",
    "outputs",
    "build",
    "dist",
    "agent-skills",
    "deploy",
]

[tool.ruff.lint.per-file-ignores]
"external/**/*.py" = ["F401", "F403", "F405", "F821", "F841", "E402", "E701", "E711", "E712", "E721", "E722", "E731", "E741", "F811"]
"CityLearn/examples/*.ipynb" = ["E402", "F401", "F404", "F821", "F841", "E712", "E731"]
"CityLearn/scripts/*.py" = ["E402"]
