schema_version: 1
description: Canonical building type registry for the Iquitos fresh campaign dataset. Every dataset module (hourly generator,
  load distillation, controlled machines, EV sizing, DER sizing) reads the building type and operating schedule from this
  file only.
source_inventory: CityLearn/data/buildingcsv/building.csv (Nombre_Edificio, Tipo_Uso_CityLearn, Sistemas_Refrigeracion_Grandes)
peer_group_rule: peer_group keeps the building.csv Tipo_Uso_CityLearn class; it is used only to complete missing monthly targets
  from same-year peers
reference_outdoor_temperature_c: 28.0
