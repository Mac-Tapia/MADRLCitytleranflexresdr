# Decisions implemented here (governance/decision_traceability.yaml):
#   P-017-2: the 18:00-23:00 block of Iquitos is an assumption
#   P-017-6: PV altitude = measured site elevation 115.02 m
# SPEC-017 FR-017.1: site configuration of Iquitos, the first site of the project.
# Every site value lives here (or in the files it points to), never in the code. Each value declares its origin.
schema_version: 1
name: iquitos

peak_block:
  hours: [18, 19, 20, 21, 22]   # 18:00-23:00 local time
  origin: assumption
  note: "Capacity-charge block of the Osinergmin tariffs used by the bills and the D04 bill (18:00-23:00). The block is not printed on the tariff sheets (tools/dataset/osinergmin_pliegos.py); to verify against the Osinergmin tariff resolution."

time_zone:
  utc_offset_hours: -5
  origin: cited
  source: "Peru official time, UTC-5 without daylight saving; NASA POWER files are in UTC and are shifted by this offset"

elevation_m:
  value: 115.02
  origin: measured
  source: "NASA POWER point elevation of the Iquitos weather files (geometry.coordinates)"

campaign_years:
  years: [2023, 2024, 2025]
  origin: design_rule
  source: "configs/experiments/iquitos.yaml splits train_2023, validation_2024, test_2025 (fresh campaign, owner decision 2026-11-01)"

location:
  latitude: -3.7491
  longitude: -73.2538
  time_zone_name: America/Lima
  origin: cited
  source: "NASA POWER point of the Iquitos weather requests (carried from tools/dataset/build_fresh_campaign_dataset.py and fix_solar_pvlib.py); IANA time zone of Peru"

files:   # site-specific configurations, each with its own origins
  hvac_norms: configs/dataset/hvac_norms.yaml
  ev_fleet: configs/dataset/ev_v6.yaml
  building_types: configs/dataset/building_types.yaml
  grid_emissions: configs/dataset/grid_emissions.yaml
  bill_tariffs: data/tariffs/osinergmin/bill_tariffs.csv
