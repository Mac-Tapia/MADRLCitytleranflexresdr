# National holidays of Peru, Decreto Legislativo 713 art. 6 with its amendments (SPEC-016 D-V6-60).
# Days a decree makes non-working only for the public sector are not listed: they change every year and do not bind
# private buildings. Regional school calendars are not modeled either.
schema_version: 1
origin: cited
source: Decreto Legislativo 713, art. 6; Ley 31381 (9 December); Ley 31530 (6 August); Ley 31788 (7 June); Ley 31822 (23 July)
easter_offsets_days: [-3, -2]   # Holy Thursday and Good Friday
fixed:
  - {month: 1, day: 1}
  - {month: 5, day: 1}
  - {month: 6, day: 7, from_year: 2024}    # Ley 31788 was published on 15 June 2023, after that year's date
  - {month: 6, day: 29}
  - {month: 7, day: 23}
  - {month: 7, day: 28}
  - {month: 7, day: 29}
  - {month: 8, day: 6}
  - {month: 8, day: 30}
  - {month: 10, day: 8}
  - {month: 11, day: 1}
  - {month: 12, day: 8}
  - {month: 12, day: 9}
  - {month: 12, day: 25}
