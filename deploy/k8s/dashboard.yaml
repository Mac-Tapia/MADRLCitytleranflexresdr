# Dashboard Streamlit (panel de monitoreo de la demo).
#
# Construir la imagen local antes de aplicar:
#   docker build -t madrl-dashboard:local deploy/dashboard
# y cargarla al clúster local (ver deploy/k8s/README.md).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: madrl
  labels:
    app.kubernetes.io/name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      containers:
        - name: dashboard
          image: madrl-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: INFERENCE_SERVICE_URL
              value: "http://inference:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: madrl
  labels:
    app.kubernetes.io/name: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 8501
      targetPort: 8501
