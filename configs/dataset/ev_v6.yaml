# SPEC-016 FR-016.5, D-V6-6 and D-V6-21: chargers and vehicles of iquitos_v6 (2030 scenario).
# Every value declares its origin. Sources audited: docs/audits/cargadores_vehiculos_20261107/README.md
schema_version: 1

space_m2:
  # RNE A.010 (RM 191-2021-VIVIENDA): space width x (length + half the aisle). The norm gives no area with
  # circulation; these areas are derived from its dimensions.
  car_public: {value: 20.625, origin: design_rule, source: "A.010 art. 54.2, Cuadro 04: 2.50 m (3+ contiguous) x (5.00 m + 6.50/2 m aisle)"}
  car_private: {value: 19.2, origin: design_rule, source: "A.010 art. 54.1, Cuadro 03: 2.40 m (3+ contiguous) x (5.00 m + 6.00/2 m aisle)"}
  moto_public: {value: 8.625, origin: design_rule, source: "A.010 art. 57.2, Cuadro 06: 1.50 x (2.50 m + 6.50/2 m aisle)"}
  moto_private: {value: 8.25, origin: design_rule, source: "A.010 art. 57.2, Cuadro 06: 1.50 x (2.50 m + 6.00/2 m aisle)"}

private_use_types: [Office, Office_Critical, MultiFamily_Hotel]   # A.010 art. 54.1; every other type is public use (54.2)

charging_points:
  per_spaces: 10
  minimum_spaces: 20
  origin: cited
  source: "Directive (EU) 2024/1275 (EPBD recast), art. 14(2): existing non-residential buildings with more than 20 parking spaces, at least one recharging point for every 10 spaces. Peru sets no minimum (D.S. 036-2023-EM, D.S. 022-2020-EM)."


# D-V6-24: each word of the inventory's predominant vehicle type names a class; Students and Buses add none.
vehicle_type_tokens_origin: design_rule
vehicle_type_tokens:
  Motos: moto
  Bicycles: moto
  Motokars: mototaxi
  Taxis: mototaxi
  Pickups: pickup
  Cars: pickup
  Ambulances: pickup
  Staff: pickup
  Trucks: pickup
  Military: pickup
  Emergency: pickup
  Cranes: pickup
  Vehicles: pickup
  Medical: pickup
  Heavy: pickup
  Cargo: pickup
  Industrial: pickup

fleet_split:
  named_share: 0.80
  origin: design_rule
  source: "D-V6-26 (owner 2026-11-07): the classes named by the predominant inventory type share 80 % of the building's EVs, the others 20 %, largest-remainder rounding"

# D-V6-23, D-V6-27 and D-V6-28. Sources audited: docs/audits/cargadores_vehiculos_20261107/clases_vehiculo.md
classes:
  moto:
    v2g: false
    charging: {standard: IEC 61851-1, current: AC, mode: 2, connector: "socket base 220 V 16 A (D.S. 036-2023-EM annex 5) with the vehicle's portable off-board charger", category: slow, direction: unidirectional, origin: design_rule,
               source: "D-V6-33 (owner 2026-11-07): mode 2 at the buildings' parking; D.S. 036-2023-EM arts. 29.3-29.9 allow mode 2 there and art. 4.27 leaves motorcycles out of micromobility (mode 1). Unidirectional in every datasheet reviewed (Vmoto Soco CPx, Motocorp E1). Categories from catalogues, not from the decree (D.S. 036-2023-EM defines none): slow below 3.7 kW, semi-fast 3.7-22 kW AC (changing-transport.org business-model guide; Kia Peru: semi-fast 7.4-22 kW AC, fast from 50 kW DC). Audit: docs/audits/cargadores_vehiculos_20261107/modo_y_cargador.md"}
    battery_kwh: {value: 2.7, origin: cited, source: "Super Soco CPx official sheet: 60 V x 45 Ah per pack (V x Ah computed), one pack"}
    charge_kw: {value: 0.6, origin: cited, source: "Super Soco CPx official sheet: 60 V 10 A on-board charger (V x A computed); the vehicle limits the mode 2 socket of D.S. 036-2023-EM"}
    discharge_kw: {value: 0.0, origin: design_rule, source: "D-V6-23: motorcycles only charge"}
    kwh_per_km: {value: 0.039, origin: cited, source: "Super Soco CPx official sheet: 140 km with 2 packs (5.4 kWh), computed"}
    km_per_day: {value: 40.0, origin: assumption_pending_user_verification, note: "No Peruvian or Latin American source for e-motorcycle daily distance"}
    penetration: {value: 0.05, origin: assumption_pending_user_verification, note: "PE of D-V6-27; no official source per class (the MINEM 5 % is press-only, the NDC excludes motorcycles)"}
  mototaxi:
    v2g: false
    charging: {standard: IEC 61851-1, current: AC, mode: 2, connector: "socket base 220 V 16 A (D.S. 036-2023-EM annex 5); on-board (Bajaj RE E-TEC 9.0) or off-board (Piaggio Ape E-City) charger by model", category: slow, direction: unidirectional, origin: design_rule,
               source: "D-V6-33 (owner 2026-11-07): mode 2; B03 airport, absent from the decree, keeps mode 2 as a declared assumption. Unidirectional in every datasheet reviewed (Bajaj, Mahindra Treo, Piaggio Ape E-City). Categories from catalogues, not from the decree (D.S. 036-2023-EM defines none): slow below 3.7 kW, semi-fast 3.7-22 kW AC (changing-transport.org business-model guide; Kia Peru: semi-fast 7.4-22 kW AC, fast from 50 kW DC). Audit: docs/audits/cargadores_vehiculos_20261107/modo_y_cargador.md"}
    battery_kwh: {value: 8.6, origin: cited, source: "Piaggio Ape E-City MAXX official page (Piaggio India): 8.6 kWh Li-ion, 51.2 V"}
    charge_kw: {value: 3.52, origin: cited, source: "D.S. 036-2023-EM annex 5, mode 2 at 220 V 16 A (V x A computed); below the 4.8 kW on-board charger of Abaya et al. (2019) table 1.1"}
    discharge_kw: {value: 0.0, origin: design_rule, source: "D-V6-23: mototaxis only charge"}
    kwh_per_km: {value: 0.125, origin: cited, source: "Abaya et al. (2019), Proc. EASTS 12, table 2.5: 7.99 km/kWh, e-trike in public transport, high demand"}
    km_per_day: {value: 38.25, origin: cited, source: "Abaya et al. (2019) table 2.5: 4.78 kWh/day at 0.125 kWh/km (computed), within the 34-45 km/day reported"}
    penetration: {value: 0.05, origin: assumption_pending_user_verification, note: "PE of D-V6-27; no official source per class"}
  pickup:
    v2g: true
    charging: {standard: IEC 61851-1, current: AC, mode: 3, connector: "Type 2 AC wallbox (SAVE), 220 V single phase 32 A (D.S. 036-2023-EM annex 6)", category: semi_fast, direction: v2b_through_v2l, origin: design_rule,
               source: "D-V6-33 (owner 2026-11-07): semi-fast mode 3 only, no DC fast charger. D-V6-32: a Type 2 mode-3 wallbox cannot discharge; the pickup discharges to the building through its V2L outlet and a transfer panel (assumption, no product documents it), without export. Categories from catalogues, not from the decree (D.S. 036-2023-EM defines none): slow below 3.7 kW, semi-fast 3.7-22 kW AC (changing-transport.org business-model guide; Kia Peru: semi-fast 7.4-22 kW AC, fast from 50 kW DC). Audit: docs/audits/cargadores_vehiculos_20261107/modo_y_cargador.md"}
    battery_kwh: {value: 98.4, origin: cited, source: "Maxus eTerron 9 datasheet, Maxus Espana, Dec 2024: 98.40 kWh net"}
    charge_kw: {value: 7.04, origin: cited, source: "D.S. 036-2023-EM annex 6, mode 3 Type 2 at 220 V 32 A single-phase (V x A computed); the eTerron 9 accepts 11 kW AC three-phase"}
    discharge_kw: {value: 6.6, origin: cited, source: "D-V6-32 (owner 2026-11-07): V2L of the Maxus eTerron 9, 6.6 kW (e-mobileo distributor https://www.e-mobileo.de/?p=38297; carz.com.my; paultan, press), to the building only (V2B behind the meter, D-V6-28)"}
    kwh_per_km: {value: 0.267, origin: cited, source: "Maxus eTerron 9 datasheet: 26.7 kWh/100 km WLTP combined"}
    km_per_day: {value: 40.0, origin: assumption_pending_user_verification, note: "No Peruvian source for the daily distance of pickups"}
    penetration: {value: 0.05, origin: assumption_pending_user_verification, note: "PE of D-V6-27; the NDC (MINAM 2023) gives 171 359 light EVs by 2030 but no share"}

# D-V6-34 (owner 2026-11-07): battery and charger parameters of every class, carried from the B01 pilot
# (configs/dataset/ev_pilot.yaml) until datasheets per class exist. D-V6-35: the agent modulates the charging
# power between the minimum and the maximum of each class (in mode 2 a declared modelling assumption).
battery_and_charger:
  battery_efficiency: {value: 0.92, origin: assumption, source: "D-V6-34; ev_pilot.yaml battery_efficiency, carried from the earlier light-EV battery, no datasheet"}
  battery_depth_of_discharge: {value: 0.80, origin: assumption, source: "D-V6-34; ev_pilot.yaml battery_depth_of_discharge"}
  capacity_loss_coefficient: {value: 1.0e-5, origin: cited, source: "lower end of the CityLearn Battery default range (1e-5, 1e-4), CityLearn/citylearn/energy_model.py"}
  charger_efficiency: {value: 0.95, origin: assumption, source: "D-V6-34; ev_pilot.yaml charger efficiency, carried from the earlier dataset, no nameplate"}
  min_current_a: {value: 6, origin: cited, source: "D-V6-34; external/evcc/core/loadpoint.go NewLoadpoint default minCurrent 6 A"}
  supply_voltage_v: {value: 220, origin: cited, source: "CNE-Suministro 2011, 220 V low-voltage supply; D.S. 036-2023-EM annexes 5 and 6"}
  min_power_rule: "min charging power = supply_voltage_v x min_current_a (1.32 kW) when the class maximum reaches it, else 0 (motorcycle: 0 to 0.6 kW)"

# D-V6-38 (owner 2026-11-07): every physical charger has two sockets; each socket is one CityLearn charger
# (one action). P-V6-20: each socket charges at its class power; the building total is capped by the
# demand factor (coincidence_cap_kw). The B01 pilot had the same layout (ev_pilot.yaml sockets_per_unit 2).
charging_unit:
  sockets_per_unit: {value: 2, origin: design_rule, source: "D-V6-38 (owner 2026-11-07): dual-socket chargers"}

# D-V6-29: arrival rules by class (owner 2026-11-07). Opening hours come from the building's schedule in
# configs/dataset/building_types.yaml (occupied_hours).
arrivals:
  origin: assumption
  source: "D-V6-29 (owner 2026-11-07): motorcycles and pickups of the staff arrive in the 2 first hours after opening and leave at closing; mototaxis make 2 short stops, 12-14 h and 18-20 h"
  moto: {kind: opening, window_h: 2}
  pickup: {kind: opening, window_h: 2}
  mototaxi: {kind: stops, stops: [[12, 14], [18, 20]]}

# Rules the implementation chose for the queue (SPEC-016 P-V6-14 to P-V6-16), pending the owner.
queue_rules:
  origin: implementation_rule
  note: "P-V6-14 chargers split by class in proportion to its EVs; P-V6-15 a day is open when its day factor is at least open_day_min_factor, a vehicle arrives having used one session's energy and asks for a full battery; P-V6-16 the charger is released when the charging time at nominal power ends; seed of the arrival draw"
  open_day_min_factor: 0.5
  seed: 0

demand_factor:
  # D-V6-27 (FC). D.S. 036-2023-EM art. 13.3.1: with a charge-management system (SGC) the demand factor of the
  # table applies "como minimo"; the lower end of each range is taken (0.6 and 0.5). Factor 1 up to the first
  # threshold, the middle factor up to 150 kW, the last one above.
  origin: cited
  source: "D.S. 036-2023-EM (El Peruano 2023-12-31), art. 13.3.1, demand factor table by installation type"
  middle_factor: 0.6
  upper_factor: 0.5
  upper_threshold_kw: 150.0
  use_types:   # first threshold (kW) of the table row each inventory type belongs to
    Office: 40.0             # oficinas, hoteles
    Office_Critical: 40.0
    MultiFamily_Hotel: 40.0
    Commercial_Mall: 100.0   # centros comerciales, deportivos, recreativos
    Retail: 100.0
    Education: 20.0          # edificaciones dedicadas a la educacion
    Assembly_Military: 20.0  # escuela tecnica: educacion
    Assembly: 20.0           # aeropuerto: via publica, zonas de parqueo publico
    Healthcare: 20.0         # IPRESS
    Healthcare_Hospital: 20.0
    Laboratory: 20.0         # parqueo privado (row choice declared)
    Industrial: 20.0         # locales industriales
    Industrial_Port: 20.0

heavy_vehicle_types: [Military_Vehicles, Emergency_Trucks, Heavy_Cargo_Trucks, Heavy_Industrial_Cranes]
