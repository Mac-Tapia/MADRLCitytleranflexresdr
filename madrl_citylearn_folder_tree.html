
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-mono,'Consolas',monospace);font-size:13px;color:var(--color-text-primary)}
.tree-wrap{padding:16px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px;border-bottom:1px solid var(--color-border-tertiary)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:12px;font-size:11px;font-family:var(--font-sans)}
.b-py{background:#dbeafe;color:#1d4ed8}.b-yaml{background:#fef9c3;color:#92400e}.b-md{background:#f0fdf4;color:#166534}
.b-cfg{background:#fce7f3;color:#9d174d}.b-sh{background:#f3e8ff;color:#6b21a8}.b-nb{background:#fff7ed;color:#9a3412}
.b-json{background:#f1f5f9;color:#475569}.b-git{background:#fee2e2;color:#991b1b}.b-lock{background:#e0e7ff;color:#3730a3}
@media(prefers-color-scheme:dark){
.b-py{background:#1e3a5f;color:#93c5fd}.b-yaml{background:#422006;color:#fde68a}.b-md{background:#052e16;color:#86efac}
.b-cfg{background:#4a044e;color:#f0abfc}.b-sh{background:#2e1065;color:#c4b5fd}.b-nb{background:#431407;color:#fdba74}
.b-json{background:#1e293b;color:#94a3b8}.b-git{background:#450a0a;color:#fca5a5}.b-lock{background:#1e1b4b;color:#a5b4fc}
}
.node{display:flex;align-items:flex-start;gap:0;cursor:pointer;border-radius:4px;padding:1px 6px 1px 0;user-select:none;transition:background .12s}
.node:hover{background:var(--color-background-secondary)}
.indent{display:flex;align-items:stretch;flex-shrink:0}
.vline{width:18px;display:flex;justify-content:center;padding-top:0}
.vline-inner{width:1px;background:var(--color-border-tertiary);height:100%}
.connector{width:18px;flex-shrink:0;display:flex;align-items:flex-start;padding-top:9px}
.connector-inner{display:flex;align-items:center;gap:0}
.h-line{height:1px;width:10px;background:var(--color-border-tertiary)}
.icon{font-size:14px;line-height:1;flex-shrink:0;margin-right:5px;margin-top:1px}
.arrow{font-size:10px;color:var(--color-text-tertiary);margin-right:4px;transition:transform .15s;display:inline-block;flex-shrink:0;margin-top:2px}
.arrow.open{transform:rotate(90deg)}
.name{font-family:var(--font-mono);font-size:13px;color:var(--color-text-primary);line-height:1.5}
.name.folder{font-weight:500}
.name.special{color:#7c3aed}
.name.root-file{color:var(--color-text-secondary)}
.chip{font-size:10px;padding:1px 6px;border-radius:8px;font-family:var(--font-sans);margin-left:6px;font-weight:400;vertical-align:middle}
.chip-new{background:#dcfce7;color:#15803d}.chip-key{background:#dbeafe;color:#1d4ed8}.chip-algo{background:#fce7f3;color:#9d174d}
@media(prefers-color-scheme:dark){
.chip-new{background:#14532d;color:#86efac}.chip-key{background:#1e3a5f;color:#93c5fd}.chip-algo{background:#4a044e;color:#f0abfc}
}
.desc{font-size:11px;color:var(--color-text-tertiary);margin-left:8px;font-family:var(--font-sans);padding-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.children{overflow:hidden;transition:max-height .2s ease}
.children.closed{max-height:0}
.children.open{max-height:9999px}
.section-label{font-family:var(--font-sans);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-tertiary);padding:10px 16px 4px;border-top:1px solid var(--color-border-tertiary);margin-top:6px}
.count-badge{font-family:var(--font-sans);font-size:10px;background:var(--color-background-secondary);border:1px solid var(--color-border-tertiary);border-radius:10px;padding:1px 6px;color:var(--color-text-secondary);margin-left:auto;flex-shrink:0}
.row-wrap{display:flex;align-items:center;width:100%}
.stats{display:flex;gap:16px;padding:14px 16px 0;border-top:1px solid var(--color-border-tertiary);margin-top:8px;font-family:var(--font-sans)}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat-n{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.stat-l{font-size:11px;color:var(--color-text-tertiary)}
</style>

let folderCount=0, fileCount=0, pyCount=0;

function extClass(ext){
  const m={py:'b-py',yaml:'b-yaml',toml:'b-yaml',md:'b-md',sh:'b-sh',ipynb:'b-nb',
    git:'b-git',lock:'b-lock',json:'b-json',env:'b-json'};
  return m[ext]||'b-cfg';
}
function extIcon(ext){return ICON[ext]||ICON.default}
function chipClass(c){return c==='key'?'chip-key':c==='algo'?'chip-algo':'chip-new'}
function chipLabel(c){return c==='key'?'clave':c==='algo'?'algo':'nuevo'}

function buildNode(node, depth, isLast, parentLines){
  if(node.type==='folder') folderCount++;
  else { fileCount++; if(node.ext==='py') pyCount++; }

  const el = document.createElement('div');

  if(node.type==='folder'){
    const id = 'f_'+Math.random().toString(36).slice(2);

    const row = document.createElement('div');
    row.className='node';

    // Indent lines
    const indent = document.createElement('div');
    indent.className='indent';
    if(depth>0){
      for(let i=0;i<depth-1;i++){
        const vl=document.createElement('div');vl.className='vline';
        const vli=document.createElement('div');vli.className='vline-inner';
        vl.appendChild(vli);indent.appendChild(vl);
      }
      const conn=document.createElement('div');conn.className='connector';
      const ci=document.createElement('div');ci.className='connector-inner';
      const hl=document.createElement('div');hl.className='h-line';
      ci.appendChild(hl);conn.appendChild(ci);indent.appendChild(conn);
    }
    row.appendChild(indent);

    const wrap=document.createElement('div');wrap.className='row-wrap';
    const arr=document.createElement('span');arr.className='arrow open';arr.textContent='▶';
    const icon=document.createElement('span');icon.className='icon';icon.textContent=node.open!==false?'📂':'📁';
    const nm=document.createElement('span');nm.className='name folder';nm.textContent=node.name;

    wrap.appendChild(arr);wrap.appendChild(icon);wrap.appendChild(nm);

    if(node.chip){
      const ch=document.createElement('span');
      ch.className='chip '+(node.chip==='key'?'chip-key':'chip-new');
      ch.textContent=node.chip==='key'?'clave':'nuevo';
      wrap.appendChild(ch);
    }
    if(node.children){
      const cb=document.createElement('span');cb.className='count-badge';
      cb.textContent=node.children.length+' items';
      wrap.appendChild(cb);
    }
    if(node.desc){
      const desc=document.createElement('span');desc.className='desc';desc.textContent='— '+node.desc;
      wrap.appendChild(desc);
    }
    row.appendChild(wrap);

    const children=document.createElement('div');
    children.className='children open';children.id=id;

    if(node.children){
      node.children.forEach((child,i)=>{
        children.appendChild(buildNode(child,depth+1,i===node.children.length-1));
      });
    }

    row.onclick=(e)=>{
      e.stopPropagation();
      const open=children.classList.contains('open');
      children.classList.toggle('open',!open);
      children.classList.toggle('closed',open);
      arr.classList.toggle('open',!open);
      icon.textContent=!open?'📂':'📁';
    };

    el.appendChild(row);el.appendChild(children);

  } else {
    const row=document.createElement('div');row.className='node';

    const indent=document.createElement('div');indent.className='indent';
    for(let i=0;i<depth-1;i++){
      const vl=document.createElement('div');vl.className='vline';
      const vli=document.createElement('div');vli.className='vline-inner';
      vl.appendChild(vli);indent.appendChild(vl);
    }
    if(depth>0){
      const conn=document.createElement('div');conn.className='connector';
      const ci=document.createElement('div');ci.className='connector-inner';
      const hl=document.createElement('div');hl.className='h-line';
      ci.appendChild(hl);conn.appendChild(ci);indent.appendChild(conn);
    }
    row.appendChild(indent);

    const wrap=document.createElement('div');wrap.className='row-wrap';
    const icon=document.createElement('span');icon.className='icon';icon.textContent=extIcon(node.ext);
    const nm=document.createElement('span');nm.className='name';
    nm.style.color=node.ext==='py'?'var(--color-text-info)':
      node.ext==='git'?'var(--color-text-danger)':
      node.ext==='md'?'var(--color-text-success)':
      node.ext==='yaml'||node.ext==='toml'?'var(--color-text-warning)':'var(--color-text-secondary)';
    nm.textContent=node.name+(node.ext&&!node.name.includes('.')&&node.ext!=='git'&&node.ext!=='sh'?'.'+node.ext:'');

    wrap.appendChild(icon);wrap.appendChild(nm);

    if(node.chip){
      const ch=document.createElement('span');
      ch.className='chip '+chipClass(node.chip);
      ch.textContent=chipLabel(node.chip);
      wrap.appendChild(ch);
    }
    if(node.desc){
      const desc=document.createElement('span');desc.className='desc';desc.textContent='— '+node.desc;
      wrap.appendChild(desc);
    }
    row.appendChild(wrap);
    el.appendChild(row);
  }
  return el;
}

const container=document.getElementById('tree');
container.appendChild(buildNode(data,0,true));

document.getElementById('s-folders').textContent=folderCount;
document.getElementById('s-files').textContent=fileCount;
document.getElementById('s-py').textContent=pyCount;
