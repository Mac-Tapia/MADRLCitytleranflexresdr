    canonical_type: utility_office
    schedule: office_daytime
    peer_group: Office
    justification: 'ELECTRO ORIENTE S.A. is the regional electricity distribution utility; 40 offices and a DataCenter Precision
      AC in building.csv: daytime administrative office with a 24 h critical IT load (critical-load proxy in the distillation)'
    cooling_cop_design:
      value: 2.8
      origin: assumption
      assumption: true
      reason: design COP at the 28 C reference outdoor temperature, carried from distill_building_loads.ETA_BY_USE for this
        use class; no nameplate data
    controlled_machine_cycle_kwh:
      value: 14.8
      origin: assumption
      assumption: true
      reason: daily energy of the controllable shiftable load carried from generate_iquitos_dataset.MADRL_BUILDING_CONSTANTS[shiftable];
        no inventory of these machines exists; it is subtracted from the bill, not added on top
