# SPEC-016 FR-016.5, D-V6-6 and D-V6-21: chargers and vehicles of iquitos_v6 (2030 scenario).
# Every value declares its origin. Sources audited: docs/audits/cargadores_vehiculos_20261107/README.md
schema_version: 1

space_m2:
  # RNE A.010 (RM 191-2021-VIVIENDA): space width x (length + half the aisle). The norm gives no area with
  # circulation; these areas are derived from its dimensions.
  car_public: {value: 20.625, origin: design_rule, source: "A.010 art. 54.2, Cuadro 04: 2.50 m (3+ contiguous) x (5.00 m + 6.50/2 m aisle)"}
  car_private: {value: 19.2, origin: design_rule, source: "A.010 art. 54.1, Cuadro 03: 2.40 m (3+ contiguous) x (5.00 m + 6.00/2 m aisle)"}
  moto_public: {value: 8.625, origin: design_rule, source: "A.010 art. 57.2, Cuadro 06: 1.50 x (2.50 m + 6.50/2 m aisle)"}
  moto_private: {value: 8.25, origin: design_rule, source: "A.010 art. 57.2, Cuadro 06: 1.50 x (2.50 m + 6.00/2 m aisle)"}

private_use_types: [Office, Office_Critical, MultiFamily_Hotel]   # A.010 art. 54.1; every other type is public use (54.2)

charging_points:
  per_spaces: 10
  minimum_spaces: 20
  origin: cited
  source: "Directive (EU) 2024/1275 (EPBD recast), art. 14(2): existing non-residential buildings with more than 20 parking spaces, at least one recharging point for every 10 spaces. Peru sets no minimum (D.S. 036-2023-EM, D.S. 022-2020-EM)."

ev_share:
  value: 0.05
  origin: assumption_pending_user_verification
  note: "5 % of the parked vehicles electric by 2030, attributed to MINEM only in the press (Andina 2021). The official NDC measure (MINAM Informe 00232-2023, para 3.5) gives 171 359 light EVs and excludes motorcycles. Same share for every vehicle class."

charger_kw:
  moto: {value: 3.52, origin: cited, source: "D.S. 036-2023-EM, annex 5: mode 2, 220 V single-phase 16 A (V x I computed). 220 V is the nominal low voltage of CNE-Suministro 2011, rule 017.A"}
  car: {value: 7.04, origin: cited, source: "D.S. 036-2023-EM, annex 6: mode 3, 220 V single-phase 32 A (V x I computed)"}

daily_energy_kwh:
  moto: {value: 4.145, origin: cited, source: "Abaya et al. (2019), Proc. EASTS 12, tables 2.4 and 2.5: e-tricycle 3.51 (low demand) and 4.78 (high demand) kWh/day, mean taken; Philippines, not Peru"}
  car: {value: 8.64, origin: assumption_pending_user_verification, note: "0.216 kWh/km (Chuquiguanga and Jimenez 2018, Cuenca, Ecuador, abstract) x 40 km/day; the daily distance has no Peruvian source"}

heavy_vehicle_types: [Military_Vehicles, Emergency_Trucks, Heavy_Cargo_Trucks, Heavy_Industrial_Cranes]
