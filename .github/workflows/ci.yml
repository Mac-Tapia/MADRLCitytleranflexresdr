name: CI

on:
  push:
    branches: [master, main, 'fix/**', 'feat/**', 'audit/**', 'refactor/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Portable CPU checks of the candidate commit (T13, docs/design/entrenamiento.md §13.3).
# They do not run native learners, GPU, CityLearn simulations or the campaign dataset:
# native acceptance stays local, behind the local root guard, which is not invoked
# here. On this runner the checkout identity is verified instead by
# scripts/quality/verify_ci_checkout.py. A green run is never scientific acceptance.
#
# Action pins: full commit SHAs resolved with `git ls-remote --tags` on 2026-11-01
# (actions/checkout v4.3.0, actions/setup-python v5.6.0). To update, resolve the new
# tag the same way and replace the SHA and the comment together.
#
# Runner pin: ubuntu-latest moved to 26.04, where setup-python has no Python 3.9, so every
# job failed before running anything. Moving the image requires the project's Python on it.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TOOLS: pytest==8.4.2 pyyaml==6.0.3 tomli==2.4.1 numpy==1.23.5 scipy==1.10.1 pandas==2.0.3

jobs:
  lint:
    name: quality-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.9"
      - run: python -m pip install ruff==0.15.17
      - run: ruff check uc3m tests tools/ops scripts/quality

  contracts:
    name: quality-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.9"
      - run: python -m pip install $TOOLS
      - name: Verify checkout identity
        run: python scripts/quality/verify_ci_checkout.py --repository Mac-Tapia/MADRLCitytleranflexresdr --commit "$GITHUB_SHA"
      # The deselected test compares the catalog with CityLearn, which CI does not check out.
      # It runs in the complete local gate, where an omission rejects the run.
      - name: Fresh pure contracts (strict profile, skips fail)
        run: >-
          python -B -m pytest -q -p no:cacheprovider -rfEs
          --deselect tests/fresh_training/test_seed_statistics.py::test_catalog_kpi_rules_equal_citylearn_v3
          tests/fresh_training/test_security_and_acceptance.py
          tests/fresh_training/test_seed_statistics.py
          tests/fresh_training/test_short_layout.py
          tests/fresh_training/test_fresh_isolation.py

  package:
    name: quality-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.9"
      - run: python -m pip install $TOOLS setuptools==82.0.1 wheel==0.38.0
      - name: Wheel content, installed import and portable configuration
        run: >-
          python -B -m pytest -q -p no:cacheprovider -rfEs tests/fresh_training/test_github_readiness.py
          -k "package or installed_import or portable or dependencies"

  layout:
    name: quality-layout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.9"
      - run: python -m pip install $TOOLS
      - name: Candidate tree, names and single launch path
        run: >-
          python -B -m pytest -q -p no:cacheprovider -rfEs
          tests/fresh_training/test_single_launch_path.py
          tests/fresh_training/test_github_readiness.py -k "candidate_tree or blob_size"

  workflows:
    name: quality-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.9"
      - run: python -m pip install $TOOLS
      - name: Workflow permissions, pins, jobs and paths
        run: >-
          python -B -m pytest -q -p no:cacheprovider -rfEs tests/fresh_training/test_github_readiness.py
          -k "workflow or actions_pin or untrusted_pr or remote_acceptance or local_training_guard"
