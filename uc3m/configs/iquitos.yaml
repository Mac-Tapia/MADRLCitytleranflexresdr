# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  UC3M — Configuración Ciudad Iquitos, Perú                             ║
# ║  17 edificios institucionales/comerciales — Sistema aislado diesel     ║
# ║  Sistema eléctrico: ELECTRO ORIENTE S.A. + GENRENT                    ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Hereda de base.yaml. Override completo de los parámetros ciudad-específicos.

defaults:
  - base

# ── Identificación ────────────────────────────────────────────────────────
experiment:
  name:    "uc3m_iquitos_2023_2025"
  version: "1.0.0"
  seed:    42

# ── Dataset Iquitos 2023–2025 (26 304 horas) ────────────────────────────
dataset:
  schema_path: "CityLearn/data/datasets/citylearn_iquitos_2023_2025/schema.json"
  name:        "iquitos_2023_2025"
  n_buildings: 17
  years:       [2023, 2024, 2025]
  n_hours:     26304    # 8760 + 8784 (bisiesto) + 8760

# ── Clima Iquitos (Köppen Af — Tropical lluvioso) ─────────────────────────
# Datos geográficos reales: lat=-3.7491, lon=-73.2538, alt=106 m
climate:
  lat:         -3.7491
  lon:         -73.2538
  alt_m:       106.0
  t_avg_c:     26.5      # °C promedio anual Iquitos (SENAMHI)
  hr_avg_pct:  85.0      # % HR promedio (clima tropical muy húmedo)
  ghi_avg_wm2: 520.0     # W/m² GHI promedio (irradiancia alta ecuatorial)
  koppen:      "Af"      # Tropical lluvioso — sin estación seca

# ── Función de recompensa 7-dimensional — calibrada para Iquitos ─────────
reward:
  lambdas: [0.25, 0.25, 0.20, 0.10, 0.05, 0.10, 0.05]
  baseline:
    # ELECTRO ORIENTE: generación 100% diesel (factor MINAM/RAGEI 2019)
    co2_kgperkwh:      0.790    # kg CO₂/kWh — sistema aislado diesel puro
    # OSINERGMIN MT3/MT4 Iquitos — tarifa punta
    cost_usd_per_kwh:  0.380    # USD/kWh hora punta (18:00–22:59)
    peak_kw:           1000.0   # kW — demanda punta comunidad 17 edificios
    discomfort_c:      2.0      # °C — incumplimiento setpoint (ASHRAE-55 tropical)
    soh_loss_per_h:    1.0e-5   # pérdida SoH/h LFP en operación normal
    outage_load_kw:    100.0    # kW — carga sin cobertura en corte de red
    acs_cop_base:      0.85     # COP calefón eléctrico resistivo (referencia)

# ── Entrenamiento específico Iquitos ─────────────────────────────────────
training:
  total_timesteps: 10_000_000
  n_episodes:      400
  episode_length:  8760         # 1 año de simulación = episodio
  eval_interval:   20
  save_interval:   50

# ── Contrato operativo oficial del flujo CityLearn v3 MADRL ──────────────
# La campaña oficial se lanza desde PowerShell; esta sección documenta los
# parámetros vigentes para dataset, monitor, artefactos y comparación.
official_training:
  launcher: "CityLearn/scripts/launch_citylearn_v3_official_training.ps1"
  wrapper: "scripts/run_citylearn_v3_full_training_visible.ps1"
  active_output_pointer: "outputs/latest_visible_training_output_root.txt"
  output_root_pattern: "outputs/citylearn_v3_madrl_full_<yyyyMMdd_HHmmss>"
  algorithms: ["happo", "masac", "matd3", "maac"]
  baseline_comparison_agents: ["baseline", "hour_rbc"]
  baseline_comparison_script: "CityLearn/scripts/benchmark_citylearn_v2_agents.py"
  sb3_comparison_agents: ["ppo", "sac", "a2c"]
  sb3_comparison_scripts:
    ppo: "CityLearn/scripts/benchmark_citylearn_v2_ppo.py"
    sac: "CityLearn/scripts/benchmark_citylearn_v2_sac.py"
    a2c: "CityLearn/scripts/benchmark_citylearn_v2_a2c.py"
  scenarios: ["E1", "E2", "E3"]
  seed: 0
  episodes: 75
  episode_time_steps: 8760
  num_env_steps: 657000
  cuda: true
  gpu_profile: "local4060_fast"
  torch_threads: 8
  artifact_profile: "efficient"
  trace_record_interval: 10
  trace_detail: "compact"
  required_job_artifacts:
    - "data/results.json"
    - "data/training_summary.json"
    - "data/timeseries.csv"
    - "data/trace.csv"
    - "data/checkpoint_manifest.json"
    - "figures/figures_manifest.json"

# ── BACT tensor — dimensiones confirmadas ────────────────────────────────
bact:
  ka: 14    # activos: BESS, PV, EV, HP, DHW, Wind, H2, etc.
  kc: 8     # clima: lat, lon, alt, T, HR, GHI, Köppen grupo/código
  kb: 7     # edificio: tipo, área, U_muro, COP, pisos, ocupación, 24h
  # dim total por edificio = 29

# ── Edificios Iquitos (referencia rápida) ────────────────────────────────
buildings:
  1:  {name: "ELECTRO ORIENTE S.A.",                         type: "Office",              area_m2: 14000}
  2:  {name: "MUNICIPALIDAD DISTRITAL DE SAN JUAN BAUTISTA", type: "Office",              area_m2: 8000}
  3:  {name: "AEROPUERTO INTERNACIONAL",                     type: "Assembly",            area_m2: 6000}
  4:  {name: "HIPERMERCADOS TOTTUS ORIENTE SAC",             type: "Retail",              area_m2: 2500}
  5:  {name: "HOTEL PLAZA S.A.",                             type: "MultiFamily_Hotel",   area_m2: 1142}
  6:  {name: "MALL AVENTURA S.A.",                           type: "Commercial_Mall",     area_m2: 20637}
  7:  {name: "UNAP-FACULTAD DE BIOLOGIA-AULAS",              type: "Education",           area_m2: 8103}
  8:  {name: "PNP- ESCUELA TECNICA SUPERIOR-IQUITOS",        type: "Assembly_Military",   area_m2: 21000}
  9:  {name: "GOBIERNO REGIONAL DE LORETO - COER",           type: "Office_Critical",     area_m2: 4480}
  10: {name: "GOBIERNO REGIONAL DE LORETO",                  type: "Office",              area_m2: 14296}
  11: {name: "HOSPITAL REGIONAL DE LORETO",                  type: "Healthcare_Hospital", area_m2: 42649}
  12: {name: "SEGURO SOCIAL DE SALUD - ESSALUD",             type: "Healthcare",          area_m2: 18197}
  13: {name: "UNAP-FACULTAD DE CIENCIAS AD..CONTABLES Y ECO", type: "Education",          area_m2: 2723}
  14: {name: "AUTORIDAD PORTUARIA NACIONAL",                 type: "Industrial_Port",     area_m2: 17761}
  15: {name: "DREL- COLEGIO NACIONAL DE IQUITOS",            type: "Education",           area_m2: 9890}
  16: {name: "SIMA - IQUITOS S.R.LTDA",                      type: "Industrial",          area_m2: 10294}
  17: {name: "ASOCIACION CIVIL SELVA AMAZONICA",             type: "Laboratory",          area_m2: 1611}

# ── EV Iquitos — escenario de tesis por edificio/tipo/concurrencia ───────
# No representa un censo historico de flota electrica medida en Iquitos.
# CityLearn controla tomas/loadpoints; cada equipo fisico Mode 3 agrupa
# dos tomas simultaneas mediante physical_charger_id.
ev:
  total_tomas_mode3: 185
  equipos_fisicos_mode3_doble_toma: 96
  ev_pool_total: 1850
  potencia_nominal_total_kw: 749.4
  mototaxi_kw:    4.0    # mototaxi electrica de escenario
  motolineal_kw:  3.0    # moto lineal electrica de escenario
  camioneta_kw:   7.4    # camioneta electrica institucional/logistica de escenario
  v2g_enabled: false

# ── Tarifa TOU OSINERGMIN MT3/MT4 ────────────────────────────────────────
pricing:
  peak_hours:         [18, 19, 20, 21, 22]   # horas punta (18:00–22:59)
  peak_usd_per_kwh:   0.38
  offpeak_usd_per_kwh: 0.26
  # Nota: todos los 17 edificios son clientes en Media Tensión (MT)

# ── Emisiones CO₂ ─────────────────────────────────────────────────────────
carbon:
  base_kg_per_kwh:  0.790    # diesel 100% (MINAM INFOCARBONO / RAGEI 2019)
  solar_penetration: 0.15    # ~15% penetración FV actual ELECTRO ORIENTE
  # carbon_intensity[t] = 0.790 × (1 - 0.15 × GHI[t]/1000)
  # Rango: 0.672–0.790 kg CO₂/kWh

# ── Logging específico ────────────────────────────────────────────────────
logging:
  backend:  "console"
  log_dir:  "logs/uc3m/iquitos"
  project:  "UC3M-Iquitos-MADRL"

checkpoints:
  dir: "checkpoints/iquitos"
