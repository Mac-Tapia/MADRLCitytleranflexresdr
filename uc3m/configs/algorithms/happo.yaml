# ╔════════════════════════════════════════════════════════╗
# ║  HAPPO — Heterogeneous-Agent Proximal Policy Optim.  ║
# ║  HARL backend (external/HARL)                        ║
# ╚════════════════════════════════════════════════════════╝
# Hereda de iquitos.yaml por defecto

defaults:
  - iquitos

training:
  algorithm:         "HAPPO"
  harl_mode:         true
  n_rollout_threads: 1
  total_timesteps:   10_000_000

network:
  hidden_sizes:   [256, 256]
  activation:     "relu"
  use_orthogonal: true
  use_rnn:        false      # HAPPO funciona bien sin RNN en CityLearn

optim:
  lr_actor:     3.0e-4
  lr_critic:    3.0e-4
  ppo_epoch:    10
  clip_param:   0.2
  gamma:        0.99
  gae_lambda:   0.95
  entropy_coef: 0.01
  max_grad_norm: 10.0
  mini_batch_size: 256
  huber_delta:  10.0

# Factor de corrección secuencial HAPPO (§4.4.3)
happo:
  ratio_clip: true
  use_factor_clip: true
