schema_version: 1
# Limits are project preferences, not GitHub/PEP requirements.
directory_limit: 24
file_limit: 40
excluded_roots:
  - CityLearn
  - external
  - tools/skills
  - .agents/skills
  - .claude/skills
  - .superpowers
  - .venv39-citylearn-v3
  - .vscode
  - data/maintenance/names
  - outputs
excluded_components: [.git, __pycache__, .pytest_cache, .ruff_cache, .tmp, node_modules, build, dist]
mandatory_names: [README.md, AGENTS.md, CLAUDE.md, Dockerfile, LICENSE, LICENSE.txt, CHANGELOG.md, CHANGES.md, STATUS.md, CODEOWNERS, MANIFEST.in, 00_INDEX.md, ISSUE_TEMPLATE.md, PULL_REQUEST_TEMPLATE.md]
conventional_paths:
  .github/*: GitHub client and workflow conventions; existing short names retained.
  .specify/*: Spec Kit client templates and command names; IDs and paths are tool contracts.
  .claude/*: Client settings and hooks; do not rename client contracts.
exceptions:
  docs/architecture/AGENT_HARNESS.md: Stable contract referenced by protected local skills.
  docs/contributions/HARL: Upstream repository identity used by provenance consumers.
  docs/contributions/MAAC: Upstream repository identity used by provenance consumers.
  docs/contributions/MARL: Upstream repository identity used by provenance consumers.
  docs/contributions/MARLlib: Upstream repository identity used by provenance consumers.
  docs/contributions/MATD3implementation: Upstream repository identity used by provenance consumers.
  docs/contributions/MicroGrids: Upstream repository identity used by provenance consumers.
  docs/contributions/CityLearn: Upstream repository identity used by provenance consumers.
immutable_roots:
  - data/audits
  - data/dataset_audit
  - data/maintenance/historicos
  - data/maintenance/retire_historical_20261101
  - governance/naming.yaml
immutable_patterns:
  - tests/fresh_training/test_names.py  # Explicit old-path fixtures, not active file consumers.
  - docs/*.json
  - docs/audits/*.json
  - docs/audits/word/*.json
mutable_json_paths: [docs/workflow_manifest.json, data/audits/evaluation_tools_inventory.json]
# Old paths below are explicit provenance. Never rewrite this registry using
# its own map. Only this closed list is authorized for native movement.
