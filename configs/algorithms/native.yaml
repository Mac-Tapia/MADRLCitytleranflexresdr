# Decisions implemented here (governance/decision_traceability.yaml):
#   D-M3-1: MASAC keeps its native capacity
#   D-M3-2: MASAC VRAM requirement per rnn_hidden_dim candidate
#   D-M3-4: the Colab plan of the official run is only improved, never changed
#   FR-015.2: requirement per HPO candidate, unknown candidate refused
#   FR-015.3: the 4 MADRL keep their authors' capacity
schema_version: 1
# Resolved native configuration of the fresh campaign (design section 5).
# Every hyperparameter maps to flags the native launcher really parses
# (checked by tests/fresh_training/test_campaign_contract.py); an unknown key
# fails instead of being ignored. Native defaults not listed stay frozen and
# are serialized per attempt in resolved_backend_config.json.
# Runtime flags for every launcher: native defaults are CPU with one thread.
# runtime_requirements (GiB, estimates + margin, owner 2026-11-01: native capacity,
# no silent clamp): checked by uc3m/adapters/algorithms/native_entrypoint.py
# before the learner runs on episodes >= applies_from_episode_time_steps; below
# them the attempt is refused with insufficient_resources:<algorithm>:<ram|vram>.
runtime_flags: [--cuda]
hyperparameter_grid:
  learning_rate: [0.0001, 0.0003]
  hidden_dimension: [128, 256]
  gamma: [0.99, 0.9999]
# optimizer_owners: optimizers the native guard must observe updating in an
# accepted attempt (names as the native backends emit them; {i} = agent index
# 0..n_agents-1 from the split schema). Acceptance derives the expected set
# from here, never from the owners that happen to appear in the evidence.
algorithms:
  HAPPO:
    mapping: {learning_rate: [--actor-lr, --critic-lr], hidden_dimension: [--hidden-size], gamma: [--gamma]}
    # SPEC-015 D-M3-7/D-M3-10: the continuous output is rounded to the common grid of 5 levels per equipment.
    fixed_flags: {action_grid_levels: --action-grid-levels}
    fixed: {action_grid_levels: 5}
    optimizer_owners: {per_agent: ['actor_agent{i}'], shared: [critic]}
    # On-policy rollout of one 8760-step episode: ~1.2 GiB float32 (obs + state).
    # Author update of external/HARL happo.yaml kept (ppo_epoch 5, critic_epoch 5, one
    # minibatch); bound by tests/fresh_training/test_author_capacity.py.
    runtime_requirements: {min_ram_gib: 8, min_vram_gib: 4, applies_from_episode_time_steps: 1000}
    declared_limitations:
      - "common action grid (SPEC-015 D-M3-7, D-M3-9, D-M3-10): the 4 MADRL act on the same 5 levels per equipment; HAPPO and MATD3 keep their continuous output rounded by the environment, MASAC and MAAC choose one level per equipment with a multi-discrete head (action branching, Tavakoli et al. 2018), a declared change of their original action head."
      - "one parallel environment instead of the author's 20 n_rollout_threads (owner 2026-11-06): each copy is the whole 17-building district and the Colab plan is not changed; one 8760-step episode gives 8760 steps per update, more than the author's 20 x 200 = 4000."
      - "continuous actions are padded to the largest equipment count (D03, SPEC-015 D-M3-6): an output with no equipment in its building is inert, cut before the simulator; the equipment of every output is the building's action_names."
  MASAC:
    # MASAC keeps its native QMIX mixing architecture; parameter counts differ.
    mapping: {learning_rate: [--actor-lr, --critic-lr], hidden_dimension: [--rnn-hidden-dim], gamma: [--gamma]}
    # Native capacity, no clamp (owner 2026-11-01). Author defaults of
    # external/MARL/src/common/arguments.py: critic_batch_size 32 EPISODES,
    # critic_train_steps 1, episode buffer 5000. buffer_size counts EPISODES; 50
    # holds every episode of the longest stage (confirm, 50) and the launcher
    # keeps min(50, run episodes), a lossless bound. qmix/hyper widths follow the
    # author ratio to the grid rnn_hidden_dim (qmix = rnn/2, hyper = rnn).
    # D-M3-9/D-M3-10: one categorical of 5 levels per equipment (multi-discrete head, padded branches masked).
    fixed_flags: {buffer_size: --buffer-size, critic_batch_size: --critic-batch-size,
                  critic_train_steps: --critic-train-steps, discrete_action_mode: --discrete-action-mode}
    fixed: {buffer_size: 50, critic_batch_size: 32, critic_train_steps: 1, discrete_action_mode: grid}
    optimizer_owners: {per_agent: [], shared: [masac_policy, masac_critic_q1, masac_critic_q2, masac_alpha]}
    # SPEC-015: requirement = max(floor, ceil(1.10 x estimate)) on the ACTIVE dataset, bound by
    # tests/fresh_training/test_runtime_requirements.py. iquitos_v6_trial13 with the common grid of 5 levels per
    # equipment (D-M3-10: 44 equipments x 5 = 220 actions), the air conditioning (D-V6-53), the bill (D-V6-50) and
    # class-aggregated charger observations (D-V6-49; 17 agents, obs 39, state 633, T 8760): replay 50 ep =
    # 45.14 GiB; critic over 32 x 8760 steps = 66.47 GiB (rnn 128) / 95.07 GiB (rnn 256). On trial7 (axis mode,
    # 87 actions, obs 37, state 599): 22.56 / 47.30 / 75.90 GiB. Before,
    # iquitos_v5 (obs 37, state 371, 9 actions): 8.09 GiB replay, 35.27 / 63.87 GiB critic. Historical, iquitos_v1 (obs 357, state 1652, 89 actions): 65.3 GiB
    # replay and 74.7 / 103.3 GiB critic, declared as 72 / 82 GiB. VRAM is per candidate because the
    # critic batch, not the buffer, fixes it (the buffer samples with replacement).
    # SPEC-015 D-M3-8 (owner 2026-11-07): on iquitos_v6 MASAC searches only rnn_hidden_dim 128; the 256
    # candidate needs 105 GiB of VRAM (ceil(1.10 x 95.07)), above an 80 GB GPU (74.5 GiB). Native capacity kept.
    hyperparameter_grid_override: {hidden_dimension: [128]}
    runtime_requirements: {min_ram_gib: 50, min_vram_gib_by_rnn_hidden_dim: {128: 74},
                           applies_from_episode_time_steps: 1000}
    declared_limitations:
      - "common action grid (SPEC-015 D-M3-7, D-M3-9, D-M3-10): the 4 MADRL act on the same 5 levels per equipment; HAPPO and MATD3 keep their continuous output rounded by the environment, MASAC and MAAC choose one level per equipment with a multi-discrete head (action branching, Tavakoli et al. 2018), a declared change of their original action head."
      - "one QMIX critic update per episode (author critic_train_steps=1) over a 32-episode batch; the update budget per environment step differs from the other backends (declared confound)."
      - "SPEC-015 D-M3-8: on iquitos_v6 MASAC searches only rnn_hidden_dim 128 (74 GiB of VRAM, an 80 GB GPU of 74.5 GiB); the 256 candidate of the shared grid needs 105 GiB and is not trainable on an 80 GB GPU, so MASAC's search space is narrower than the other three backends' (declared). The 220 actions of the common grid (D-M3-10: 44 equipments x 5 levels) set the size."
  MATD3:
    mapping: {learning_rate: [--lr], hidden_dimension: [--hidden-size], gamma: [--gamma]}
    # buffer_size > 16384 is the TOTAL across the 17 per-agent policies (native rule
    # effective_matd3_per_policy_buffer_size): 744600 // 17 = 43800 transitions per
    # policy = five 8760-step episodes, the MAAC horizon. The 40 GiB per worker is the
    # reservation already tuned for the Colab campaign (owner 2026-11-06: not to be changed);
    # it fixes the phase-2 parallelism. It was sized on iquitos_v1 (obs 357, joint 6069,
    # action 44: 35.8 GiB) and covers iquitos_v5 (obs 37, joint 629, action 4: 3.72 GiB),
    # which tests/fresh_training/test_runtime_requirements.py checks. The entrypoint sets
    # MATD3_MAX_REPLAY_RAM_GIB to the measured available RAM, so the launcher refuses
    # instead of shrinking.
    fixed_flags: {batch_size: --batch-size, buffer_size: --buffer-size, action_grid_levels: --action-grid-levels}
    fixed: {batch_size: 256, buffer_size: 744600, action_grid_levels: 5}
    optimizer_owners: {per_agent: ['policy_{i}/actor', 'policy_{i}/critic'], shared: []}
    runtime_requirements: {min_ram_gib: 40, min_vram_gib: 4, applies_from_episode_time_steps: 1000}
    declared_limitations:
      - "common action grid (SPEC-015 D-M3-7, D-M3-9, D-M3-10): the 4 MADRL act on the same 5 levels per equipment; HAPPO and MATD3 keep their continuous output rounded by the environment, MASAC and MAAC choose one level per equipment with a multi-discrete head (action branching, Tavakoli et al. 2018), a declared change of their original action head."
      - "continuous actions are padded to the largest equipment count (D03, SPEC-015 D-M3-6): an output with no equipment in its building is inert, cut before the simulator; the equipment of every output is the building's action_names."
  MAAC:
    mapping: {learning_rate: [--pi-lr, --q-lr], hidden_dimension: [--hidden-size], gamma: [--gamma]}
    # Author schema of external/MAAC/main.py (owner 2026-11-06, SPEC-015 D-M3-5): buffer_length
    # 1e6 transitions, batch_size 1024, 4 updates every 100 steps. The launcher keeps
    # min(1e6, run_steps + one episode), a lossless bound: 50 x 8760 + 8760 = 446760 holds the
    # whole run. Before 2026-11-06 it was 43800 transitions, batch 256 and 1 update per step.
    # D-M3-9/D-M3-10: one categorical of 5 levels per real equipment (MultiDiscrete action space).
    fixed_flags: {batch_size: --batch-size, buffer_length: --buffer-length,
                  steps_per_update: --steps-per-update, num_updates: --num-updates,
                  discrete_action_mode: --discrete-action-mode}
    fixed: {batch_size: 1024, buffer_length: 1000000, steps_per_update: 100, num_updates: 4,
            discrete_action_mode: grid}
    optimizer_owners: {per_agent: ['maac_agent{i}_policy'], shared: [maac_critic]}
    # Replay float32 upper bound on the active dataset, bound by
    # tests/fresh_training/test_author_capacity.py: 17 x 446760 x (2 x obs + actions + 1) x 4 B
    # + done bytes, about 2.3 GiB on iquitos_v5, inside the 8 GiB reservation.
    runtime_requirements: {min_ram_gib: 8, min_vram_gib: 4, applies_from_episode_time_steps: 1000}
    declared_limitations:
      - "common action grid (SPEC-015 D-M3-7, D-M3-9, D-M3-10): the 4 MADRL act on the same 5 levels per equipment; HAPPO and MATD3 keep their continuous output rounded by the environment, MASAC and MAAC choose one level per equipment with a multi-discrete head (action branching, Tavakoli et al. 2018), a declared change of their original action head."
      - "one parallel environment instead of the author's 12 n_rollout_threads (owner 2026-11-06): each copy is the whole 17-building district and the Colab plan is not changed; the schedule of 4 updates per 100 environment steps is the author's."
      - "4 updates per 100 environment steps differ from the update budget of the other backends (declared confound, as MASAC)."
