name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# El proyecto real usa el paquete `uc3m/` y Python 3.9. Este CI corre SOLO los
# tests de dominio puros (no requieren CityLearn pesado, torch, GPU ni el
# dataset Iquitos): bastan numpy/scipy/pyyaml. La suite de integracion completa
# (UC3MEnv + dataset) se ejecuta localmente / en deploy/aws, no en CI.

jobs:
  foundation:
    name: Local-first foundation gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Create project tooling environment
        shell: pwsh
        run: |
          python -m venv .venv39-citylearn-v3
          .venv39-citylearn-v3\Scripts\python.exe -m pip install pytest pyyaml tomli numpy scipy

      - name: Run the same local foundation gate
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/quality/run_foundation_gates.ps1

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      # Respeta la configuracion de [tool.ruff] en pyproject.toml.
      - name: Ruff check
        run: ruff check uc3m tests

  test:
    name: Unit tests (dominio puro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # Dependencias minimas: el dominio uc3m solo necesita numpy/scipy a nivel
      # de import; pyyaml para configs; pytest para correr la suite.
      - name: Install minimal test deps
        run: python -m pip install --upgrade pip pytest numpy scipy pyyaml

      - name: Verify clean import
        run: |
          python -c "import uc3m; from uc3m.data import build_source, available_sources; print('available_sources:', available_sources())"

      # Solo archivos de test que NO requieren CityLearn/dataset/torch.
      - name: Run pure-domain tests
        run: |
          python -m pytest -q \
            tests/uc3m/test_bact.py \
            tests/uc3m/test_reward_axes.py \
            tests/uc3m/test_hphi.py \
            tests/uc3m/test_data_ingestion.py \
            tests/uc3m/test_data_adapters_remote.py
