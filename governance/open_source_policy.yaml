schema_version: "1.0"
default_decision: block

allow:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MPL-2.0

review:
  - EUPL-1.1
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later

block:
  - NOASSERTION
  - LicenseRef-Proprietary

constraints:
  payment_required: block
  saas_required: block
  missing_license: block
  copyleft: review
